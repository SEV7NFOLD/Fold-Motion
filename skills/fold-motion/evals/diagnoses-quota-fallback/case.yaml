schema_version: "1.1"
name: diagnoses-quota-fallback
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Identifies the HTTP 429 quota error on the free tier (20 requests per day for gemini-3.8-flash) as the cause. Explains that keys created in the same Google project share one quota,
  which is why adding keys did not help. Recommends switching GEMINI_MODEL to gemini-3.5-flash-lite (much larger free daily quota), waiting for the reset, or enabling billing;
  mentions GEMINI_ROTATE_ON_QUOTA only for keys from separate projects. Does not suggest loosening validation or hiding the fallback.
